[package]
name = "webspeed-language-server"
version = "0.0.1"
edition = "2024"
description = "Language Server Protocol implementation for OpenEdge WebSpeed (.htm/.html)"
license = "MIT"

[dependencies]
anyhow = "1"
dashmap = "6.1.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp = { version = "0.20.0", features = ["proposed"] }
tree-sitter = "0.26"
tree-sitter-abl = { git = "https://github.com/usagi-coffee/tree-sitter-abl", tag = "v0.0.52" }
tree-sitter-javascript = "0.25.0"

abl-config = { path = "../concept-ci/abl-fmt/crates/abl-config" }
abl-parser = { path = "../concept-ci/abl-fmt/crates/abl-parser" }
abl-printer = { path = "../concept-ci/abl-fmt/crates/abl-printer" }

[profile.release]
lto = true
